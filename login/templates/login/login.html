{% extends 'wrapper.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<form class="row g-3 needs-validation w-50 mx-auto" method="POST" novalidate>
  {% csrf_token %}
  <div class="md-2">
    <label for="validationPhone" class="form-label">Номер телефона</label>
    <input type="text" name="{{ form.username.name }}" class="form-control" id="validationPhone" value="+7" maxlength="12" required>
    <div class="valid-feedback">
      Все хорошо!
    </div>
    <div class="invalid-feedback">
      Введите номер корректно!
    </div>
  </div>
  <div class="md-4">
    <label for="validationPassword" class="form-label">Пароль</label>
    <input type="password" name="{{ form.password.name }}" class="form-control" id="validationPassword" maxlength="117" required>
    <div class="valid-feedback">
      Все хорошо!
    </div>
    <div class="invalid-feedback">
      Введите пароль!
    </div>
  </div>



  <div class="col-13">
    <button class="btn btn-primary mt-4" type="submit">Войти</button>
  </div>
    <div class="col-13">
    <button class="btn btn-primary" type="submit"> <a class="nav-link {% if '/contact/' in request.path %}active{% endif %} text-white"
                               href="/registration">
                                Регистрация
                            </a></button>
  </div>
  {% csrf_token %}
</form>
{% load static %}
<script src="{% static 'login/js/login.js' %}"></script>

{% endblock %}
